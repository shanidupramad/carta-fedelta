<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#2563eb">
<title>Cassa fedeltà</title>
<style>
  *{box-sizing:border-box}
  body{font-family:system-ui,-apple-system,sans-serif;background:#eef1f5;margin:0;padding:20px;color:#1e293b}
  .box{max-width:420px;margin:auto;background:#fff;border-radius:20px;padding:24px;box-shadow:0 6px 24px #0002}
  h2{margin-top:0}
  input,button{font-size:18px;padding:13px;border-radius:12px;width:100%;margin:6px 0}
  input{border:2px solid #cbd5e1}
  button{border:0;color:#fff;font-weight:bold;cursor:pointer}
  button:focus-visible,input:focus{outline:3px solid #2563eb;outline-offset:2px}
  .verde{background:#16a34a}.blu{background:#2563eb}.viola{background:#7c3aed}
  #esito{margin-top:14px;padding:14px;border-radius:12px;background:#e2e8f0;font-size:18px}
</style>
</head>
<body>
<div class="box">
  <h2 id="titolo">🏪 Cassa fedeltà</h2>
  <input id="pin" type="password" placeholder="PIN del negozio" inputmode="numeric">
  <input id="tel" type="tel" placeholder="Telefono del cliente">
  <button class="viola" onclick="scansiona()">📷 Scansiona QR cliente</button>
  <div id="lettore" style="width:100%"></div>
  <button class="verde" onclick="azione('timbro')">➕ Aggiungi timbro</button>
  <button class="blu" onclick="azione('premio')">🎁 Consegna premio</button>
  <div id="esito">Pronto.</div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
<script>
const URL_API = "https://script.google.com/macros/s/AKfycbwmK8AAgcL9EIXb1x3LdXddMtCUySrLeQWnjuMugnhuN6MivEosg5cfKLZur0URmiaSrA/exec";
const N = new URLSearchParams(location.search).get("n") || "";
document.getElementById("pin").value = localStorage.getItem("pin_" + N) || "";

(async () => {
  try {
    const d = await (await fetch(`${URL_API}?azione=info&n=${encodeURIComponent(N)}`)).json();
    document.getElementById("titolo").textContent = d.ok ? "🏪 " + d.negozio.nome : "❌ Link non valido";
  } catch (e) {}
})();

async function azione(tipo) {
  const pin = document.getElementById("pin").value.trim();
  const tel = document.getElementById("tel").value.replace(/\D/g, "");
  const e = document.getElementById("esito");
  e.textContent = "Attendi...";
  try {
    const url = `${URL_API}?azione=${tipo}&n=${encodeURIComponent(N)}&tel=${tel}&pin=${encodeURIComponent(pin)}`;
    const d = await (await fetch(url)).json();
    if (d.ok) {
      localStorage.setItem("pin_" + N, pin);
      e.textContent = `✅ ${d.msg} Timbri: ${d.timbri}/${d.soglia}` + (d.premio ? " 🎉 PREMIO DISPONIBILE" : "");
      document.getElementById("tel").value = "";
    } else e.textContent = "❌ " + d.msg;
  } catch (err) { e.textContent = "❌ Errore di connessione"; }
}

let scanner = null;
function scansiona() {
  if (scanner) return;
  scanner = new Html5Qrcode("lettore");
  scanner.start({ facingMode: "environment" }, { fps: 10, qrbox: 220 }, (testo) => {
    document.getElementById("tel").value = testo;
    scanner.stop().then(() => { document.getElementById("lettore").innerHTML = ""; scanner = null; });
  }).catch(() => {
    document.getElementById("esito").textContent = "❌ Fotocamera non disponibile: scrivi il numero a mano.";
    scanner = null;
  });
}
</script>
</body>
</html>
